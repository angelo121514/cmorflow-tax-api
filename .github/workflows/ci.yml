name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tax_api_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tax_api_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_E2E_URL: postgres://postgres:postgres@127.0.0.1:5432/tax_api_e2e
      SDD_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
      INTEGRATION_WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run repo:check
      - run: npm run sdd:test
      - run: npm run sdd:check
      - run: npm run build
      - run: npm test -- --silent
      - run: npm run test:e2e -- --runInBand
      - run: npm run openapi:check
      - run: npx prettier --check render.yaml
      - run: docker build --tag cmorflow-tax-api:ci .
