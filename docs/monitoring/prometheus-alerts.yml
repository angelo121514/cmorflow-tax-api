groups:
  - name: cmorflow-tax-api
    rules:
      - alert: CmorFlowTaxApiUnavailable
        expr: up{job="cmorflow-tax-api"} == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "CmorFlow Tax API no responde" }
      - alert: CmorFlowWebhookDeadLetters
        expr: increase(webhook_deliveries_total{status="dead"}[15m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Webhooks fallidos superan el umbral" }
      - alert: CmorFlowSiiRejections
        expr: increase(sii_rejections_total[30m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "El SII rechazó documentos recientemente" }
      - alert: CmorFlowQueueBacklog
        expr: sum(integration_queue_depth{state=~"queued|processing"}) > 100
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "La cola tributaria acumula solicitudes" }
      - alert: CmorFlowHighSiiLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(integration_request_duration_seconds_bucket{phase="to_finalized"}[30m]))) > 600
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "La aceptación SII p95 supera 10 minutos" }
      - alert: CmorFlowRetrySpike
        expr: increase(integration_retries_total[15m]) > 20
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Aumento anormal de reintentos tributarios" }
      - alert: CmorFlowLowFolioStock
        expr: folio_stock < 20
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Stock de folios bajo para un tenant/tipo DTE" }
      - alert: CmorFlowCertificateExpiring
        expr: sii_certificate_expiry_days < 30
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Certificado digital próximo a vencer" }
